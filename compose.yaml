# LanTube Host on the LAN.
# Catalogue: existing Postgres on the LAN, not a container.
# Bytes: Media share bind-mounted at /media.
# Secrets: /etc/lantube/production.env on the Host (not in git).
# House-specific hostname and DNS pins: $HOME/.config/lantube/compose.override.yaml
# on the Host, symlinked as compose.override.yaml (see compose.override.example.yaml).
name: lantube

services:
  lantube:
    build:
      context: .
      dockerfile: Dockerfile
    image: lantube:local
    init: true
    restart: unless-stopped
    env_file:
      - /etc/lantube/production.env
    environment:
      NODE_ENV: production
      PORT: '44100'
      HOST: '0.0.0.0'
      LANTUBE_MEDIA_DIR: /media
    ports:
      - '80:44100'
    volumes:
      - /mnt/lantube-media:/media
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:44100/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
