# LanTube Host on the LAN.
# Catalogue: existing Postgres (expsql01), not a container.
# Bytes: Media share bind-mounted at /media.
# Secrets: /etc/lantube/production.env on the Host (not in git).
name: lantube

services:
  lantube:
    build:
      context: .
      dockerfile: Dockerfile
    image: lantube:local
    hostname: phantom
    init: true
    restart: unless-stopped
    env_file:
      - /etc/lantube/production.env
    environment:
      NODE_ENV: production
      PORT: '44100'
      HOST: '0.0.0.0'
      LANTUBE_MEDIA_DIR: /media
    ports:
      - '80:44100'
    volumes:
      - /mnt/lantube-media:/media
    extra_hosts:
      - 'expsql01:192.168.1.133'
      - 'expsql01.metropolis.excaliburstudios.org:192.168.1.133'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:44100/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
